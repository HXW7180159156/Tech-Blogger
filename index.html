<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tech Blogger MVP Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">AI-Everything · 可演示闭环</p>
      <h1>技术博客写作 APP MVP</h1>
      <p>
        从 Markdown 技术草稿导入，到编辑预览、辅助改写，再到微信公众号、小红书、抖音三平台稿件导出。
      </p>
    </header>

    <main class="workspace">
      <section class="panel editor-panel" aria-labelledby="editor-heading">
        <div class="panel-header">
          <div>
            <p class="step">步骤 1</p>
            <h2 id="editor-heading">导入与编辑</h2>
          </div>
          <button id="load-sample" type="button">载入示例文章</button>
        </div>

        <label for="article-title">文章标题</label>
        <input id="article-title" type="text" placeholder="输入技术文章标题" />

        <label for="markdown-input">Markdown 内容</label>
        <textarea id="markdown-input" spellcheck="false" placeholder="粘贴 Markdown 技术草稿..."></textarea>

        <div class="actions" aria-label="AI 辅助动作">
          <button id="summarize" type="button">生成摘要</button>
          <button id="optimize-title" type="button">优化标题</button>
          <button id="rewrite-platform" type="button">生成平台改写</button>
        </div>

        <section class="assist-card" aria-labelledby="assist-heading">
          <h3 id="assist-heading">辅助结果</h3>
          <p id="summary-output">载入或粘贴文章后，可生成摘要、标题建议和平台改写方向。</p>
          <div id="title-suggestions" class="chips"></div>
          <div id="rewrite-output" class="rewrite-output"></div>
        </section>
      </section>

      <section class="panel preview-panel" aria-labelledby="preview-heading">
        <div class="panel-header">
          <div>
            <p class="step">步骤 2</p>
            <h2 id="preview-heading">结构化预览</h2>
          </div>
          <span id="word-count" class="badge">0 字</span>
        </div>
        <article id="preview" class="preview empty">等待导入 Markdown 内容。</article>
      </section>

      <section class="panel export-panel" aria-labelledby="export-heading">
        <div class="panel-header">
          <div>
            <p class="step">步骤 3</p>
            <h2 id="export-heading">平台模板与导出</h2>
          </div>
          <button id="copy-export" type="button">复制导出稿</button>
        </div>

        <div class="template-tabs" role="tablist" aria-label="平台模板">
          <button class="active" data-template="wechat" type="button">微信公众号</button>
          <button data-template="xiaohongshu" type="button">小红书</button>
          <button data-template="douyin" type="button">抖音</button>
        </div>

        <textarea id="export-output" readonly aria-label="导出内容"></textarea>
        <p id="copy-status" class="copy-status" role="status"></p>
      </section>
    </main>

    <script src="./src/app.js"></script>
  </body>
</html>
